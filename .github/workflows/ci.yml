name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new GitHub Release tag to publish
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Run backend tests and static checks
        run: ./gradlew check --no-daemon

  frontend-tests:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            frontend/*.gradle
            frontend/gradle/wrapper/gradle-wrapper.properties
      - name: Run frontend tests and static checks
        run: xvfb-run --auto-servernum ./gradlew check --no-daemon

  package-jars:
    name: Package cross-platform JARs
    needs: [backend-tests, frontend-tests]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
            frontend/*.gradle
            frontend/gradle/wrapper/gradle-wrapper.properties
      - name: Build backend JAR
        run: ./backend/gradlew -p backend bootJar --no-daemon
      - name: Build frontend JAR
        run: |
          ./frontend/gradlew -p frontend universalJar --no-daemon
          mv frontend/build/libs/resolveit-frontend-0.1.0-universal.jar frontend/build/libs/resolveit-frontend-0.1.0.jar
      - name: Verify cross-platform JARs
        run: |
          set -euo pipefail
          backend_jar=backend/build/libs/resolveit-backend-0.1.0.jar
          frontend_jar=frontend/build/libs/resolveit-frontend-0.1.0.jar
          verification_directory=$(mktemp -d)
          trap 'rm -rf -- "$verification_directory"' EXIT

          jar --list --file "$backend_jar" | grep -q 'BOOT-INF/lib/sqlite-jdbc-'
          unzip -p "$frontend_jar" META-INF/MANIFEST.MF | grep -q 'Main-Class: resolveit.frontend.Launcher'
          jar --list --file "$frontend_jar" | grep -q '^libglass.so$'
          jar --list --file "$frontend_jar" | grep -q '^glass.dll$'
          jar --list --file "$frontend_jar" | grep -q '^libglass.dylib$'

          jar --list --file "$frontend_jar" | grep '\.dylib$' > "$verification_directory/dylibs.txt"
          while IFS= read -r native_library; do
            unzip -p "$frontend_jar" "$native_library" > "$verification_directory/$(basename "$native_library")"
            lipo "$verification_directory/$(basename "$native_library")" -verify_arch x86_64 arm64
          done < "$verification_directory/dylibs.txt"
      - name: Upload packaged JARs
        uses: actions/upload-artifact@v7
        with:
          name: resolveit-cross-platform-jars
          path: |
            backend/build/libs/resolveit-backend-0.1.0.jar
            frontend/build/libs/resolveit-frontend-0.1.0.jar
          if-no-files-found: error
      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          backend_jar=backend/build/libs/resolveit-backend-0.1.0.jar
          frontend_jar=frontend/build/libs/resolveit-frontend-0.1.0.jar
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$backend_jar" "$frontend_jar" --clobber
          else
            gh release create "$RELEASE_TAG" "$backend_jar" "$frontend_jar" \
              --title "ResolveIT $RELEASE_TAG" \
              --notes "ResolveIT cross-platform release. Requires Java 25."
          fi

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
      - name: Run backend tests
        run: ./gradlew test --no-daemon

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            frontend/*.gradle
            frontend/gradle/wrapper/gradle-wrapper.properties
      - name: Run frontend tests
        run: ./gradlew test --no-daemon

  package-jars:
    name: Package cross-platform JARs
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle
            backend/gradle/wrapper/gradle-wrapper.properties
            frontend/*.gradle
            frontend/gradle/wrapper/gradle-wrapper.properties
      - name: Build backend JAR
        run: ./backend/gradlew -p backend bootJar --no-daemon
      - name: Build frontend JAR
        run: ./frontend/gradlew -p frontend jar --no-daemon
      - name: Verify cross-platform JAR contents
        run: |
          jar --list --file backend/build/libs/resolveit-backend-0.1.0.jar | grep -q 'BOOT-INF/lib/sqlite-jdbc-'
          unzip -p frontend/build/libs/resolveit-frontend-0.1.0.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: resolveit.frontend.Launcher'
          jar --list --file frontend/build/libs/resolveit-frontend-0.1.0.jar | grep -q '^libglass.so$'
          jar --list --file frontend/build/libs/resolveit-frontend-0.1.0.jar | grep -q '^glass.dll$'
      - name: Upload JARs
        uses: actions/upload-artifact@v7
        with:
          name: resolveit-cross-platform-jars
          path: |
            backend/build/libs/resolveit-backend-0.1.0.jar
            frontend/build/libs/resolveit-frontend-0.1.0.jar
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            backend/build/libs/resolveit-backend-0.1.0.jar \
            frontend/build/libs/resolveit-frontend-0.1.0.jar \
            --title "ResolveIT v0.1.0" \
            --notes "ResolveIT application release."
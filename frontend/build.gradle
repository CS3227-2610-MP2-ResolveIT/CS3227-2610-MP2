plugins {
    id 'application'
    id 'checkstyle'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'resolveit'
version = '0.1.0'

def javafxVersion = '25.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

configurations {
    javafxMacX64
    javafxMacArm64
}

checkstyle {
    toolVersion = '14.1.0'
    configFile = file('../config/checkstyle/checkstyle.xml')
    maxErrors = 0
    maxWarnings = 0
}

javafx {
    version = javafxVersion
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'tools.jackson.core:jackson-databind:3.1.5'

    // Linux and Windows use distinct native-library filenames. The two macOS
    // archives are resolved separately and combined into universal dylibs by
    // prepareUniversalMacNatives before the distributable JAR is assembled.
    runtimeOnly "org.openjfx:javafx-graphics:${javafxVersion}:linux"
    runtimeOnly "org.openjfx:javafx-graphics:${javafxVersion}:win"
    javafxMacX64("org.openjfx:javafx-graphics:${javafxVersion}:mac") {
        transitive = false
    }
    javafxMacArm64("org.openjfx:javafx-graphics:${javafxVersion}:mac-aarch64") {
        transitive = false
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

application {
    mainClass = 'resolveit.frontend.ResolveItApplication'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

def universalMacNatives = layout.buildDirectory.dir('generated/universal-macos-natives')

tasks.register('prepareUniversalMacNatives', Exec) {
    group = 'build'
    description = 'Combines Intel and Apple-Silicon JavaFX dylibs into universal macOS libraries.'
    inputs.files(configurations.javafxMacX64, configurations.javafxMacArm64)
    outputs.dir(universalMacNatives)

    doFirst {
        commandLine(
                'bash',
                file('scripts/create-universal-macos-natives.sh'),
                configurations.javafxMacX64.singleFile,
                configurations.javafxMacArm64.singleFile,
                universalMacNatives.get().asFile)
    }
}

tasks.named('jar') {
    archiveFileName = "resolveit-frontend-${project.version}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'resolveit.frontend.Launcher'
    }
    from({
        configurations.runtimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Builds the release JAR for Windows, Linux, Intel Mac, and Apple-Silicon Mac.'
    dependsOn tasks.named('classes'), tasks.named('prepareUniversalMacNatives')
    archiveFileName = "resolveit-frontend-${project.version}-universal.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'resolveit.frontend.Launcher'
    }
    from(sourceSets.main.output)
    from({
        configurations.runtimeClasspath.collect { dependency ->
            dependency.isDirectory() ? dependency : zipTree(dependency)
        }
    }) {
        exclude '*.dylib'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
    from(universalMacNatives) {
        include '*.dylib'
    }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--add-modules', 'jdk.httpserver'
    jvmArgs '--enable-native-access=javafx.graphics,ALL-UNNAMED'
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}
